<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">🎨 Art Gallery</a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="text-center mb-4">Famous Artworks</h2>

    <div class="row">

        <!-- Art 1 -->
        <div class="col-md-4 mb-4">
            <div class="card shadow">
                 <img src="starry-night.jpg" class="card-img-top" alt="Starry Night">
                <div class="card-body text-center">
                    <h5>Starry Night</h5>
                    <p>Vincent van Gogh</p>
                    <a href="art1.html" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>

        <!-- Art 2 -->
        <div class="col-md-4 mb-4">
            <div class="card shadow">
                 <img src="mona-lisa.jpg" class="card-img-top" alt="Mona Lisa">
                <div class="card-body text-center">
                    <h5>Mona Lisa</h5>
                    <p>Leonardo da Vinci</p>
                    <a href="art2.html" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>

        <!-- Art 3 -->
        <div class="col-md-4 mb-4">
            <div class="card shadow">
                <img src="the-scream.jpg" class="card-img-top" alt="The Scream">
                <div class="card-body text-center">
                    <h5>The Scream</h5>
                    <p>Edvard Munch</p>
                    <a href="art3.html" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>

        <!-- Art 4 -->
        <div class="col-md-4 mb-4">
            <div class="card shadow">
                 <img src="girl-with-pearl-earring.jpg" class="card-img-top" alt="Girl with a Pearl Earring">
                <div class="card-body text-center">
                    <h5>Girl with a Pearl Earring</h5>
                    <p>Johannes Vermeer</p>
                    <a href="art4.html" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>

        <!-- Art 5 -->
        <div class="col-md-4 mb-4">
            <div class="card shadow">
               <img src="water-lilies.jpg" class="card-img-top" alt="Water Lilies">
                <div class="card-body text-center">
                    <h5>Water Lilies</h5>
                    <p>Claude Monet</p>
                    <a href="art5.html" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
